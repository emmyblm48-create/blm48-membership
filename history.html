<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BLM48 Membership | History</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffc0cb">
    <!-- สำหรับ iOS Home Screen Icon -->
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <!-- สำหรับ Android และ Chrome -->
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <!-- กำหนดชื่อแอปที่จะขึ้นใต้ไอคอนบนหน้าจอ Home Screen -->
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <!-- ทำให้แถบด้านบน (Status Bar) ดูเป็นแอปมากขึ้น -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        :root { --primary-pink: #ff85a2; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Quicksand', 'Kanit', sans-serif;
            margin: 0; padding: 0; min-height: 100vh; color: #222;
        }
        body.glass-mesh-bg { background: #ffffff; }

        /* 📡 แถบบนสีขาว: ปุ่มย้อนกลับซ้าย + ชื่อหน้าตรงกลาง (แบบเดียวกับหน้า Kami / Inventory / My Orders) */
        .top-navigation-bar {
            position: sticky; top: 0; z-index: 100;
            height: 56px; display: flex; align-items: center; justify-content: center;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
        }
        .nav-back-btn {
            position: absolute; left: 6px; bottom: 6px;
            width: 44px; height: 44px; background: none; border: none;
            color: #222; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .top-bar-page-title { font-size: 18px; font-weight: 600; color: #222; }

        /* แท็บหมวดขีดเส้นใต้ (แบบหน้า Shop) */
        .filter-tabs {
            position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); z-index: 90; background: #fff;
            display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none;
            padding: 0 20px; border-bottom: 1px solid #e8e8e8;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tab {
            flex-shrink: 0; background: none; border: none; cursor: pointer; position: relative;
            font-family: 'Quicksand', 'Kanit', sans-serif; font-size: 16px; font-weight: 600;
            color: #aaa; padding: 14px 0 12px;
        }
        .filter-tab.active { color: #222; }
        .filter-tab.active::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 8px; height: 5px;
            background: var(--primary-pink); opacity: .55; border-radius: 2px; z-index: -1;
        }

        .page-wrapper { max-width: 720px; margin: 0 auto; padding: 0 20px 50px; }
        .page-heading { font-size: 22px; font-weight: 700; color: #222; margin: 22px 0 6px; }

        /* 🧾 แถวรายการ: ชื่อ + วันที่ทางซ้าย, จำนวน (+เขียว / -แดง) ทางขวา คั่นเส้นบาง */
        .entry-row {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 0; border-bottom: 1px solid #ececec;
        }
        .entry-body { flex: 1; min-width: 0; }
        .entry-title {
            font-size: 16px; color: #222; line-height: 1.35;
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .entry-subtitle { font-size: 13px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .entry-timestamp { font-size: 13.5px; color: #666; margin-top: 2px; }
        .entry-amount { text-align: right; flex-shrink: 0; max-width: 45%; }
        .entry-amount-main { font-size: 18px; font-weight: 700; color: #222; }
        .entry-amount-main.is-minus { color: #ff4d5e; }
        .entry-amount-main.is-plus { color: #7cb518; }
        .entry-amount-sub { font-size: 12px; color: #999; margin-top: 2px; }

        .empty-state { text-align: center; color: #aaa; font-size: 15px; padding: 90px 20px; }
        .empty-icon {
            width: 140px; height: 124px; margin: 0 auto 18px;
            background: #f7f7f7; border-radius: 46% 54% 50% 50% / 52% 44% 56% 48%;
            display: flex; align-items: center; justify-content: center;
            font-size: 52px; color: #d0d0d0;
        }
        .loading-state { text-align: center; color: #aaa; font-size: 14px; padding: 60px 20px; }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

<div class="top-navigation-bar">
    <button type="button" class="nav-back-btn" onclick="goBack()" aria-label="ย้อนกลับ">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="top-bar-page-title">Transactions</div>
</div>

<div class="filter-tabs" id="filter-tabs">
    <button type="button" class="filter-tab active" data-type="all">All</button>
    <button type="button" class="filter-tab" data-type="purchase">Shop</button>
    <button type="button" class="filter-tab" data-type="gift">Gift</button>
    <button type="button" class="filter-tab" data-type="vote">Vote</button>
    <button type="button" class="filter-tab" data-type="cookie">Cookie</button>
</div>

<div class="page-wrapper">
    <div class="page-heading">Transaction history</div>
    <div id="history-content">
        <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
    </div>
</div>

<script>
    let allEntries = [];
    let currentFilter = 'all';

    // ย้อนกลับไปหน้าก่อนหน้า ถ้าไม่มีประวัติให้ตีกลับไปหน้าแรกแทน
    function goBack() {
        if (document.referrer && window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'index';
        }
    }

    function safeDate(ts) {
        const d = new Date(ts);
        return isNaN(d.getTime()) ? null : d;
    }

    function timeMs(ts) {
        const d = safeDate(ts);
        return d ? d.getTime() : 0;
    }

    function formatTime(ts) {
        const d = safeDate(ts);
        // 🇹🇭 บังคับแสดงผลตามไทม์โซนประเทศไทย ไม่อิงจากเครื่องผู้ใช้
        if (!d) return '-';
        const date = d.toLocaleDateString('en-GB', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'long', year: 'numeric' });
        const time = d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false });
        return `${date} ${time}`;
    }

    async function loadHistory() {
        const userData = getUserSession();
        if (!userData || !userData.username) {
            Swal.fire('กรุณาล็อกอินก่อนงับ', '', 'warning').then(() => {
                window.location.href = 'login';
            });
            return;
        }

        const historyContent = document.getElementById('history-content');

        try {
            // ประวัติทั้ง 4 ประเภทตอนนี้ sync เข้า Supabase แบบเรียลไทม์แล้ว อ่านจากตรงนั้นแทน Apps Script
            const res = await blm48GetMyHistory(userData.username);

            if (res && res.status === "success") {
                allEntries = buildUnifiedEntries(res);
                renderEntries(currentFilter);
            } else {
                historyContent.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>ไม่พบข้อมูลประวัติงับ</div>`;
            }
        } catch (e) {
            console.error(e);
            historyContent.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
        }
    }

    // โหมด Token ของการโหวต: Locked = คืนครบเมื่อปิดโหวต, Partially Burned = คืนบางส่วนตาม %, Burned = ไม่คืน
    function voteRefundNote(log) {
        const mechanic = String(log.mechanic || 'burn').toLowerCase();
        if (mechanic === 'burn') return '';
        const label = mechanic === 'lock' ? 'Locked · คืน 100%' : `Partially Burned · คืน ${Number(log.refundPercent) || 0}%`;
        return `${label} ${log.refunded ? '(คืนแล้ว)' : '(รอปิดโหวต)'}`;
    }

    // 🧩 รวมประวัติทั้ง 4 ประเภทให้อยู่ในรูปแบบเดียวกัน เพื่อแสดงเป็นไทม์ไลน์เดียวกันได้
    function buildUnifiedEntries(res) {
        const entries = [];

        (res.purchaseHistory || []).forEach(log => {
            entries.push({
                type: 'purchase',
                iconClass: 'fa-solid fa-bag-shopping',
                iconBg: '#e7f5ff',
                iconColor: '#4dabf7',
                title: escapeHtml(log.action),
                subtitle: escapeHtml(log.target),
                amountText: escapeHtml(log.amount),
                amountColor: '#4dabf7',
                subAmountText: '',
                timestamp: log.timestamp
            });
        });

        (res.giveLogs || []).forEach(log => {
            entries.push({
                type: 'cookie',
                iconClass: 'fa-solid fa-cookie-bite',
                iconBg: '#fdf0e6',
                iconColor: '#d2691e',
                title: `ปาคุกกี้ให้ ${escapeHtml(log.member)}`,
                subtitle: 'Send Cookie',
                amountText: `-${escapeHtml(log.amount)} 🍪`,
                amountColor: '#d2691e',
                subAmountText: '',
                timestamp: log.timestamp
            });
        });

        (res.voteLogs || []).forEach(log => {
            entries.push({
                type: 'vote',
                iconClass: 'fa-solid fa-crown',
                iconBg: '#ffe3ee',
                iconColor: '#ff6b81',
                title: `Vote ให้ ${escapeHtml(log.member)}`,
                subtitle: escapeHtml(log.campaignTitle),
                amountText: `-${escapeHtml(log.amount)} ${escapeHtml(log.tokenType)}`,
                amountColor: '#ff6b81',
                subAmountText: voteRefundNote(log),
                timestamp: log.timestamp
            });
        });

        (res.giftLogs || []).forEach(log => {
            const qty = Number(log.quantity) || 1;
            const totalCost = (Number(log.costCookies) || 0) * qty;
            const totalPoints = (Number(log.points) || 0) * qty;
            entries.push({
                type: 'gift',
                iconClass: 'fa-solid fa-gift',
                iconBg: '#fff0f6',
                iconColor: '#ff69b4',
                title: `ส่ง "${escapeHtml(log.giftName)}" x${qty} ให้ ${escapeHtml(log.candidateName)}`,
                subtitle: escapeHtml(log.tier),
                amountText: `-${totalCost.toLocaleString()} 🍪`,
                amountColor: '#ff5376',
                subAmountText: `+${totalPoints.toLocaleString()} pts`,
                timestamp: log.timestamp
            });
        });

        entries.sort((a, b) => timeMs(b.timestamp) - timeMs(a.timestamp));
        return entries;
    }

    function renderEntries(filterType) {
        currentFilter = filterType;
        const historyContent = document.getElementById('history-content');
        const filtered = filterType === 'all' ? allEntries : allEntries.filter(e => e.type === filterType);

        if (filtered.length === 0) {
            historyContent.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                    No transactions
                </div>`;
            return;
        }

        // สีตามเครื่องหมาย: ขึ้นต้นด้วย - = ใช้ไป (แดง), + = ได้รับ (เขียว)
        const signClass = (text) => {
            const t = String(text || '').trim();
            return t.startsWith('-') ? 'is-minus' : (t.startsWith('+') ? 'is-plus' : '');
        };

        historyContent.innerHTML = `
            <div class="entry-list">
                ${filtered.map(e => `
                    <div class="entry-row">
                        <div class="entry-body">
                            <div class="entry-title">${e.title}</div>
                            ${e.subtitle ? `<div class="entry-subtitle">${e.subtitle}</div>` : ''}
                            <div class="entry-timestamp">${formatTime(e.timestamp)}</div>
                        </div>
                        <div class="entry-amount">
                            <div class="entry-amount-main ${signClass(e.amountText)}">${e.amountText}</div>
                            ${e.subAmountText ? `<div class="entry-amount-sub">${e.subAmountText}</div>` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // ผูกปุ่มแท็บกรองหมวดหมู่
    document.getElementById('filter-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-tab');
        if (!btn) return;
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        renderEntries(btn.dataset.type);
    });

    // เรียกโหลดข้อมูลทันทีที่เปิดหน้า
    loadHistory();
</script>

</body>
</html>
