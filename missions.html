<script>
// 🎯 ภารกิจประจำวัน + 📅 เช็คอินรายเดือน (ย้ายมาจากป๊อปอัปใน index.html - ฟังก์ชัน render/claim/rescue ชุดเดิม)
// ภารกิจ: get_daily_missions เลือกชุดตาม role ให้เอง ห้าม hardcode เป้าหมาย / เช็คอิน: record_daily_login + get_login_streak_status
let user = null;
let dailyMissionData = null;
let loginStreakData = null;
const MISSION_META = {
  cookie:  { icon: 'fa-cookie-bite',   label: (p, t) => `ให้คุกกี้เมมเบอร์รวม ${t} Cookies` },
  like:    { icon: 'fa-heart',         label: (p, t) => `กดใจโพสของเดือนนี้ ${t} โพส (ต่างโพสกัน)` },
  comment: { icon: 'fa-comment-dots',  label: (p, t) => `คอมเมนต์โพสของเดือนนี้ ${t} โพส (ต่างโพสกัน)` },
  post:    { icon: 'fa-pen-to-square', label: (p, t) => `โพสอัปเดตประจำวัน ${t} โพส` }
};

// หลังรับรางวัล: ดึงยอดกระเป๋าล่าสุดเก็บลง session (หน้า Home จะโชว์ยอดใหม่ทันทีที่กลับไป)
async function syncUserData() {
  if (!user || !user.username) return;
  try {
    const wallet = await blm48GetWallet(user.username);
    if (wallet && wallet.token !== undefined) {
      user.token = wallet.token;
      user.cookie = wallet.cookie;
      user.geToken = wallet.geToken;
      saveUserSession(user);
    }
  } catch (e) { console.error('syncUserData error:', e); }
}

async function loadDailyMissions() {
  if (!user || !user.username) return null;
  try {
    const res = await blm48GetDailyMissions(user.username);
    if (res && res.status === 'success') {
      dailyMissionData = res;
      const badge = document.getElementById('mission-badge');
      if (badge) badge.style.display = (res.allDone && !res.claimed) ? 'block' : 'none';
    }
    return dailyMissionData;
  } catch (e) {
    console.error('loadDailyMissions error:', e);
    return null;
  }
}

function renderDailyMissionsModal() {
  const list = document.getElementById('mission-item-list');
  const btn = document.getElementById('mission-claim-btn');
  if (!list || !btn || !dailyMissionData) return;

  if (!dailyMissionData.missions || dailyMissionData.missions.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px 0;">บัญชีนี้ยังไม่มีภารกิจประจำวันค่ะ</div>';
    btn.disabled = true;
    btn.classList.remove('claimable');
    btn.textContent = 'ไม่มีภารกิจ';
    return;
  }

  list.innerHTML = dailyMissionData.missions.map(m => {
    const meta = MISSION_META[m.key];
    const pct = Math.min(100, Math.round((m.progress / m.target) * 100));
    return `
      <div class="mission-item ${m.done ? 'done' : ''}">
        <div class="mission-item-icon"><i class="fas ${meta.icon}"></i></div>
        <div class="mission-item-body">
          <div class="mission-item-text">${escapeHtml(meta.label(m.progress, m.target))}</div>
          <div class="mission-progress-bar"><div class="mission-progress-fill" style="width:${pct}%;"></div></div>
          <div class="mission-item-count">${m.progress}/${m.target}</div>
        </div>
        <div class="mission-item-check"><i class="fas fa-circle-check"></i></div>
      </div>`;
  }).join('');

  if (dailyMissionData.reward) document.getElementById('mission-reward').textContent = dailyMissionData.reward;

  if (dailyMissionData.claimed) {
    btn.disabled = true;
    btn.classList.remove('claimable');
    btn.innerHTML = '<i class="fas fa-circle-check"></i> รับของรางวัลวันนี้แล้ว';
  } else if (dailyMissionData.allDone) {
    btn.disabled = false;
    btn.classList.add('claimable');
    btn.innerHTML = `<i class="fas fa-gift"></i> ${dailyMissionData.reward} Tokens`;
  } else {
    btn.disabled = true;
    btn.classList.remove('claimable');
    btn.textContent = 'ทำภารกิจให้ครบก่อนนะ';
  }
}

function msUntilNextBangkokMidnight() {
  const bkkNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
  const nextMidnight = new Date(bkkNow);
  nextMidnight.setHours(24, 0, 0, 0);
  return nextMidnight - bkkNow;
}

function tickMissionCountdown() {
  const el = document.getElementById('mission-countdown');
  if (!el) return;
  const totalSec = Math.max(0, Math.floor(msUntilNextBangkokMidnight() / 1000));
  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  el.textContent = `${h}:${m}:${s}`;
}

async function claimDailyMissionReward() {
  if (!user || !user.username) return;
  const btn = document.getElementById('mission-claim-btn');
  if (btn) btn.disabled = true;
  Swal.fire({ title: 'กำลังรับของรางวัล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  try {
    const res = await blm48ClaimDailyMissionReward(user.username);
    if (res && res.status === 'success') {
      await syncUserData();
      await loadDailyMissions();
      renderDailyMissionsModal();
      Swal.fire('ทำรายการสำเร็จ', res.message, 'success');
    } else {
      Swal.fire('ทำรายการไม่สำเร็จ', (res && res.message) || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง', 'error');
      renderDailyMissionsModal();
    }
  } catch (e) {
    console.error('claimDailyMissionReward error:', e);
    Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งในภายหลัง', 'error');
  }
}

async function loadLoginStreakStatus() {
  if (!user || !user.username) return null;
  try {
    const res = await blm48GetLoginStreakStatus(user.username);
    if (res && res.status !== 'error') {
      loginStreakData = res;
      const badge = document.getElementById('streak-badge');
      if (badge) badge.style.display = (res.canClaim && !res.alreadyClaimed) ? 'block' : 'none';
    }
    return loginStreakData;
  } catch (e) {
    console.error('loadLoginStreakStatus error:', e);
    return null;
  }
}

function renderLoginStreakModal() {
  const grid = document.getElementById('streak-calendar-grid');
  const btn = document.getElementById('streak-claim-btn');
  const rescueCountEl = document.getElementById('streak-rescue-count');
  const subtitleEl = document.getElementById('streak-subtitle');
  if (!grid || !btn || !loginStreakData) return;

  const days = Array.isArray(loginStreakData.days) ? loginStreakData.days : [];
  // วันนี้ตามเวลาไทย (YYYY-MM-DD) ไว้ไฮไลต์ช่องวันนี้
  const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  // เว้นช่องว่างหน้าวันที่ 1 ให้ตรงกับหัววัน อา-ส
  const firstDate = days.length ? new Date(`${days[0].date}T00:00:00`) : null;
  const offset = firstDate && !isNaN(firstDate) ? firstDate.getDay() : 0;
  const blanks = '<div class="streak-day blank"></div>'.repeat(offset);
  grid.innerHTML = blanks + days.map(d => {
    const canRescue = d.status === 'missed' && loginStreakData.rescuesRemaining > 0 && !loginStreakData.rescueUsedToday;
    let mark = '';
    if (d.status === 'present') mark = '<i class="fas fa-check streak-mark"></i>';
    else if (d.status === 'rescued') mark = '<i class="fas fa-heart-circle-bolt streak-mark"></i>';
    else if (d.status === 'missed') mark = canRescue ? '<i class="fas fa-rotate-left streak-mark"></i>' : '<i class="fas fa-xmark streak-mark"></i>';
    const clickAttr = canRescue ? `onclick="useLoginRescue('${d.date}')"` : '';
    const todayClass = d.date === todayStr ? 'today' : '';
    return `<div class="streak-day ${d.status} ${canRescue ? 'can-rescue' : ''} ${todayClass}" ${clickAttr} title="${d.date}"><span>${d.day}</span>${mark}</div>`;
  }).join('');

  // สรุปจำนวนวันที่เช็คอินแล้ว (นับวันที่กู้ด้วย) + แถบความคืบหน้า
  const checkedCount = days.filter(d => d.status === 'present' || d.status === 'rescued').length;
  const totalDays = loginStreakData.daysInMonth || days.length;
  document.getElementById('streak-present').textContent = checkedCount;
  document.getElementById('streak-total').textContent = totalDays;
  document.getElementById('streak-progress-fill').style.width = `${totalDays ? Math.round((checkedCount / totalDays) * 100) : 0}%`;
  if (firstDate && !isNaN(firstDate)) {
    document.getElementById('streak-month').textContent = firstDate.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
  }

  rescueCountEl.textContent = `${loginStreakData.rescuesRemaining}/${loginStreakData.rescuesMax || 5}`;

  if (loginStreakData.alreadyClaimed) {
    btn.disabled = true;
    btn.classList.remove('claimable');
    btn.innerHTML = '<i class="fas fa-circle-check"></i> รับของรางวัลเดือนนี้แล้ว';
    subtitleEl.textContent = `เช็คอินครบเดือนนี้แล้ว รับ 100 Tokens ไปเรียบร้อย!`;
  } else if (loginStreakData.canClaim) {
    btn.disabled = false;
    btn.classList.add('claimable');
    btn.innerHTML = `<i class="fas fa-gift"></i> รับ 100 Tokens`;
    subtitleEl.textContent = `เช็คอินครบทุกวันแล้ว! กดรับของรางวัลได้เลย`;
  } else {
    btn.disabled = true;
    btn.classList.remove('claimable');
    btn.textContent = 'เช็คอินให้ครบเดือนก่อนนะ';
    subtitleEl.textContent = `เช็คอินแล้ว ${loginStreakData.presentCount}/${loginStreakData.daysInMonth} วัน • ครบเดือนรับ 100 Tokens เลย!`;
  }
}

async function useLoginRescue(dateStr) {
  if (!user || !user.username) return;
  const result = await Swal.fire({
    title: 'กู้วันที่พลาดเช็คอิน?',
    html: `ใช้สิทธิ์กู้ 1 ครั้ง เพื่อกู้วันที่ <b>${dateStr}</b> คืนมา`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: 'var(--primary-pink)',
    confirmButtonText: 'ใช้สิทธิ์กู้',
    cancelButtonText: 'ยกเลิก'
  });
  if (!result.isConfirmed) return;

  Swal.fire({ title: 'กำลังกู้วันที่...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  try {
    const res = await blm48UseLoginRescue(user.username, dateStr);
    if (res && res.status === 'success') {
      await loadLoginStreakStatus();
      renderLoginStreakModal();
      Swal.fire('สำเร็จ!', res.message, 'success');
    } else {
      Swal.fire('ทำรายการไม่สำเร็จ', (res && res.message) || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง', 'error');
    }
  } catch (e) {
    console.error('useLoginRescue error:', e);
    Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งในภายหลัง', 'error');
  }
}

async function claimLoginStreakReward() {
  if (!user || !user.username) return;
  const btn = document.getElementById('streak-claim-btn');
  if (btn) btn.disabled = true;
  Swal.fire({ title: 'กำลังรับของรางวัล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  try {
    const res = await blm48ClaimLoginMonthlyReward(user.username);
    if (res && res.status === 'success') {
      await syncUserData();
      await loadLoginStreakStatus();
      renderLoginStreakModal();
      Swal.fire('ทำรายการสำเร็จ', res.message, 'success');
    } else {
      Swal.fire('ทำรายการไม่สำเร็จ', (res && res.message) || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง', 'error');
      renderLoginStreakModal();
    }
  } catch (e) {
    console.error('claimLoginStreakReward error:', e);
    Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งในภายหลัง', 'error');
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  user = getUserSession();
  if (!user || !user.username) { blm48Replace('login'); return; }

  tickMissionCountdown();
  setInterval(tickMissionCountdown, 1000);

  // บันทึกเช็คอินวันนี้ก่อน (เผื่อเปิดหน้านี้ตรงๆ โดยไม่ผ่าน Home) แล้วค่อยโหลดสถานะทั้งสองส่วนพร้อมกัน
  try { await blm48RecordDailyLogin(user.username); } catch (e) { console.error('blm48RecordDailyLogin error:', e); }
  await Promise.all([
    loadDailyMissions().then(renderDailyMissionsModal),
    loadLoginStreakStatus().then(renderLoginStreakModal)
  ]);
});
</script>
